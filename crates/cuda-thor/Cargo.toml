[package]
name = "cuda-thor"
version = "0.2.0-spike"
edition = "2021"
description = "v0.2 Spikes 1+3 for SI-Thor/rolling-perception: NVRTC-from-Rust (compute_110) perceive-filter correctness, and host-side module swap at launch boundaries with epoch retirement. Thin direct FFI to libcuda + libnvrtc. Thor-only when the feature is on."
license = "MIT OR Apache-2.0"

[features]
default = []
# Gates ALL CUDA FFI, linking, GPU tests and the spike runner's GPU paths.
# Off (default): the crate is pure CPU reference code and builds/tests anywhere.
cuda-thor = []

[lib]
name = "cuda_thor"
path = "src/lib.rs"

[[bin]]
name = "spikes"
path = "src/main.rs"
