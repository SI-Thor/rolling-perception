[package]
name = "rolling-pipeline"
version = "0.1.0"
edition = "2021"
description = "Integrated end-to-end rolling-perception cascade: perceive -> decide -> direct -> refine -> publish wired through substrate rings, with lineage, sheaf refinement, deadband/hysteresis direction, counted ops, and a file-replay trace producer."
license = "MIT OR Apache-2.0"

[dependencies]
rolling-adaptive = { path = "../rolling-adaptive" }
rolling-perception = { path = "../rolling-perception" }
rolling-substrate-core = { path = "../rolling-substrate-core" }

[features]
default = []
# The two-stream-shadow GPU executor seam (see src/executor.rs). The
# feature only compiles the documented stub type: it carries no GPU
# code, links nothing, and its execute_tick returns a typed
# NoGpuBackend error. It exists so downstream wiring can name the GPU
# backend before the backend lands. OFF by default; CPU builds are
# unaffected either way.
gpu-shadow = []
