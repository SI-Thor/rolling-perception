[package]
name = "rolling-pipeline"
version = "0.1.0"
edition = "2021"
description = "Integrated end-to-end rolling-perception cascade: perceive -> decide -> direct -> refine -> publish wired through substrate rings, with lineage, sheaf refinement, deadband/hysteresis direction, counted ops, and a file-replay trace producer."
license = "MIT OR Apache-2.0"

[dependencies]
rolling-adaptive = { path = "../rolling-adaptive" }
rolling-perception = { path = "../rolling-perception" }
rolling-substrate-core = { path = "../rolling-substrate-core" }
# Only used behind `gpu-shadow`: the probe in src/executor.rs calls
# cuda-thor's public Gpu API. Enabling it turns on cuda-thor's own
# `cuda-thor` feature, whose build.rs links libcuda + libnvrtc from
# the Thor's aarch64 JetPack paths — so a `gpu-shadow` build only
# links on the Thor (or a machine with the same layout). CPU builds
# never see it.
cuda-thor = { path = "../cuda-thor", optional = true, features = ["cuda-thor"] }

[features]
default = []
# The two-stream-shadow GPU executor (see src/executor.rs). With the
# feature on, GpuShadowExecutor links cuda-thor, probes the device at
# construction, and records a placement receipt per attempted tick.
# It still executes NO tick — by choice, not by blockage: cuda-thor's
# generic API can express the fill and has Thor-proven the stencil,
# but the measured crossover bound puts any GPU-refine win above
# ~4,096 nodes (see NOT_BUILT in src/executor.rs and the README's
# Composition section), so every tick is refused with a typed error
# naming the state — NoGpuBackend when no device is present,
# GpuNotBuilt when one is. OFF by default; CPU builds are unaffected
# either way.
gpu-shadow = ["dep:cuda-thor"]
