<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confluence — player</title>
<style>
  :root { --bg:#101418; --card:#1a2129; --line:#2b3644; --txt:#e8eef4; --dim:#9db2c3;
          --accent:#57b6ff; --amber:#ffb02e; --green:#7ddc8a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding:14px 20px 6px; display:flex; justify-content:space-between; align-items:baseline; }
  h1 { font-size:20px; margin:0; } h2 { font-size:15px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:22px 20px 10px; }
  .sub { color:var(--dim); font-size:13px; }
  main { max-width:1180px; margin:0 auto; padding-bottom:40px; }
  .shelf { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; padding:0 20px; }
  .item { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; cursor:pointer; }
  .item:hover { border-color:var(--dim); }
  .item .noimg { height:110px; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:28px; background:#0a0e12; }
  .item .t { padding:8px 10px 2px; font-size:14px; }
  .item .p { padding:0 10px 9px; color:var(--dim); font-size:12px; }
  #stage { padding:0 20px; display:none; }
  #stage.open { display:block; }
  .banner { border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:10px; background:var(--card); }
  .banner.direct { border-color:#23402a; } .banner.transcoding { border-color:#2b4a66; }
  .banner.busy { border-color:var(--amber); background:#2a2110; }
  .banner .mode { font-weight:600; }
  .banner .live { color:var(--dim); font-size:13px; margin-top:2px; }
  video { width:100%; max-height:70vh; background:#000; border-radius:10px; }
  .units { padding:0 20px; color:var(--dim); font-size:13px; }
  .units b { color:var(--txt); }
  .empty { color:var(--dim); padding:10px 20px; }
  button.close { background:none; border:1px solid var(--line); color:var(--dim); border-radius:6px;
                 padding:5px 10px; cursor:pointer; font-size:13px; float:right; }
</style>
</head>
<body>
<header>
  <div><h1>Confluence — player</h1><div class="sub">The Thor serves. Direct play when it can, a transcode when it must.</div></div>
  <div class="sub" id="stamp">loading…</div>
</header>
<main>
  <div id="stage">
    <h2>Now playing</h2>
    <div class="banner" id="banner"><span class="mode">…</span><div class="live" id="live"></div></div>
    <video id="vid" controls playsinline></video>
  </div>
  <h2>Library shelf</h2>
  <div class="shelf" id="shelf"><div class="empty">No data yet.</div></div>
  <h2>Encode budget</h2>
  <div class="units" id="units">…</div>
</main>
<script>
const $ = id => document.getElementById(id);
function esc(s){ const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }
let pollTimer = null, currentSid = null;

async function loadShelf(){
  try {
    const s = await (await fetch('/api/library')).json();
    $('stamp').textContent = 'Media ' + s.media;
    if(!s.items.length){ $('shelf').innerHTML = '<div class="empty">No video items found yet.</div>'; return; }
    $('shelf').innerHTML = s.items.map(it => {
      const pr = it.probe ? `${it.probe.codec} ${it.probe.width}×${it.probe.height}` : 'unprobed';
      return `<div class="item" data-id="${esc(it.id)}"><div class="noimg">▶</div>
        <div class="t">${esc(it.title)}</div><div class="p">${esc(pr)} · ${esc(it.mode)}</div></div>`;
    }).join('');
    document.querySelectorAll('.item').forEach(el => el.addEventListener('click', () => play(el.dataset.id)));
  } catch(e) { $('stamp').textContent = 'Player backend unreachable — not a silent state.'; }
}

async function loadUnits(){
  try {
    const s = await (await fetch('/api/sessions')).json();
    const act = s.sessions.filter(x => ['starting','running'].includes(x.status));
    $('units').innerHTML = `Transcode budget: <b>${s.units_used} of ${s.units_budget}</b> units in use` +
      (s.phantom_units ? ` (includes ${s.phantom_units} test-hook units)` : '') +
      (act.length ? ' · active: ' + act.map(x => `${esc(x.item)} (${esc(x.mode)}, ${x.fps_draw} fps draw)`).join(', ') : ' · nothing transcoding');
  } catch(e) { /* stamp already reports backend loss */ }
}

async function play(id){
  clearInterval(pollTimer);
  const stage = $('stage'), banner = $('banner');
  stage.classList.add('open'); banner.className = 'banner';
  banner.querySelector('.mode').textContent = 'Asking the Thor…';
  $('live').textContent = ''; $('vid').removeAttribute('src'); $('vid').load();
  const r = await fetch('/api/play', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id})});
  const s = await r.json();
  if(!r.ok || s.state === 'busy'){
    banner.className = 'banner busy';
    banner.querySelector('.mode').textContent = '🏠 The house is busy';
    $('live').textContent = s.message || 'The Thor is at its encode budget. Direct-play items still work.';
    return;
  }
  currentSid = s.session;
  banner.className = 'banner ' + (s.mode === 'transcode' ? 'transcoding' : 'direct');
  banner.querySelector('.mode').textContent = s.mode === 'remux'
    ? 'Direct play — remuxed on the Thor, no encode spent'
    : s.mode === 'fmp4'
    ? 'Direct play — HEVC remuxed to fMP4 HLS on the Thor, no encode spent'
    : 'Transcoding on the Thor';
  pollTimer = setInterval(() => pollSession(s), 1000);
  pollSession(s, true);
}

async function pollSession(s, first){
  try {
    const st = await (await fetch('/api/session/' + s.session)).json();
    if(!st.ok) return;
    $('live').textContent = `session ${st.session} · ${st.status}` +
      (st.mode === 'transcode' ? ` · live encode draw ${st.fps_draw} fps · ${st.frames} frames out` : ` · ${st.frames} frames out`) +
      (st.reason ? ` · ${st.reason}` : '');
    if(st.playlist && !$('vid').getAttribute('src')){
      $('vid').src = st.playlist; $('vid').play().catch(()=>{});
    }
    if(['ready','failed'].includes(st.status)){
      clearInterval(pollTimer);
      if(st.status === 'ready' && st.mode === 'transcode')
        $('live').textContent += ` · finished at ${st.fps_draw} fps average draw`;
    }
    loadUnits();
  } catch(e) { /* transient */ }
}

loadShelf(); loadUnits(); setInterval(loadUnits, 5000);
</script>
</body>
</html>
